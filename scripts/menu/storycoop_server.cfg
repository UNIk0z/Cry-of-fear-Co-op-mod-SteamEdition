// Cry of Fear Co-op: settings for the host's game.
// The co-op mod runs this file at the start of every story map, on the host's PC only.
// A line that starts with // does nothing. Remove the // in front of a line to use it.
// A value set here wins over the Create Server window, for every map of the game.
// Uninstall sets this file aside; Install keeps your changes.

// Seconds a revive takes (game default 5):
// sv_coopcprtime 5

// Seconds a downed player waits before respawning on his own (game default 384).
// A respawn this way loses the items he carried:
// sv_auto_respawn_time 384

// Spray logos of the players reach the others (1 = yes, the game's default):
// sv_allowupload 1

// v0.10 options (also in the Create Server window; 0 = off):
// Run timer: 0 off, 1 chapter times, 2 always on screen
// sc_timer 0
// Outline teammates who are far away, in their colour:
// sc_outline 0
// Monster health grows with the number of players (+35% per extra player):
// sc_scale 0
// Hunted: Book Simon stalks the team (experimental):
// sc_hunted 0
// Hardcore: no saves / no respawn while down (revive only):
// sv_coop_nosave 0
// sc_norespawn 0
// Morphine trip time in seconds (game default 35):
// sv_morphinetriptime 35
// No hint pop-ups (objective reminder, key prompt):
// sv_disablehints 0

// Vote kick: a player types  votekick <name>  in the console (~); the others
// press F1 (yes) or F2 (no). Seconds the vote stays open (game default 30):
// sv_votekick_time 30
