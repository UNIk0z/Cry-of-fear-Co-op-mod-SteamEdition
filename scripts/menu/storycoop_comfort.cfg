// Cry of Fear Co-op: your view settings and co-op keys.
// The co-op mod runs this file once at every co-op start, on this PC only.
// SETTINGS in "Cry of Fear Co-op.exe" rewrites it; you can also edit it by hand.
// The game keeps key binds in its own config.cfg when it closes, so they stay set
// in normal Cry of Fear too. In a new config K is voice chat (+voicerecord).

// Unstuck (moves you out of a wall, or next to your partner)
bind "k" "sc_unstuck"
// HUD on/off for screenshots
bind "h" "sc_hud"
// Spray your logo (pick the picture in SETTINGS)
bind "t" "impulse 201"
// Ping: show the others where you look
bind "g" "sc_ping"
// Scare the nearest teammate with a laugh
bind "j" "sc_scare"

// Your colour (0 automatic, 1 red, 2 orange, 3 yellow, 4 green, 5 cyan, 6 blue, 7 purple, 8 white)
sc_color "0"
// Black and white picture (1 = on)
sc_noir "0"
